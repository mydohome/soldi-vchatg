name: Test applicazione e Docker
on:
  push:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Controlli sintassi
        run: |
          python3 -m py_compile app.py
          node --check static/app.js
          sh -n setup.sh
      - name: Build Docker
        run: docker build -t spese:test .
      - name: Avvio e test API
        run: |
          docker network create spese_ci
          printf 'PROXY_NETWORK=spese_ci\nINSTALL_KEY=ci-test-key\n' > .env
          docker compose build
          docker compose run --rm -T app python /app/app.py create-user admin 'password-di-test-lunga' '' 1
          docker compose up -d
          trap 'docker compose logs app; docker compose down -v; docker network rm spese_ci' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/ >/dev/null; then break; fi
            sleep 1
          done
          curl -fsS http://localhost:18080/ >/dev/null
          python3 - <<'PY'
          import json,urllib.request
          cookie=''
          base='http://localhost:18080/api/'
          def request(path,data=None):
              raw=json.dumps(data).encode() if data is not None else None
              req=urllib.request.Request(base+path,raw,headers={'Content-Type':'application/json','Cookie':cookie})
              return json.load(urllib.request.urlopen(req))
          raw=json.dumps({'username':'admin','password':'password-di-test-lunga'}).encode()
          response=urllib.request.urlopen(urllib.request.Request(base+'login',raw,headers={'Content-Type':'application/json'}))
          cookie=response.headers['Set-Cookie'].split(';')[0]
          s=request('state'); assert s['user']['username']=='admin'
          request('entry',{'kind':'expense','scope':'household','amount_cents':1234,'description':'Test spesa','category_id':s['categories'][0]['id'] if s['categories'][0]['kind']=='expense' else next(x['id'] for x in s['categories'] if x['kind']=='expense'),'account_id':s['accounts'][0]['id'],'date':s['today']})
          assert any(e['description']=='Test spesa' for e in request('state')['entries'])
          assert len(request('export')['entries'])==1
          print('API e persistenza OK')
          PY
          npm install --no-save playwright
          npx playwright install --with-deps chromium
          mkdir -p screenshots
          node screenshot-test.js
        env:
          COMPOSE_FILE: compose.yaml:compose.ci.yaml
      - name: Conserva screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-layout
          path: screenshots/*.png
          if-no-files-found: ignore
