<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#122d29"><link rel="manifest" href="/static/manifest.json"><link rel="stylesheet" href="/static/style.css"><title>Spese</title></head><body><div id="app"><section id="login" class="login card"><h1>Le tue spese</h1><p>Accedi al tuo spazio personale</p><form id="loginForm"><label>Nome utente<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Accedi</button></form></section><main id="main" hidden><header><h1>Spese<span class="dot">.</span></h1><span id="greeting"></span></header><nav><button data-page="dashboard" class="active">Dashboard</button><button data-page="movements">Movimenti</button><button data-page="recurring">Ricorrenti</button><button data-page="settings">Impostazioni</button></nav><section id="content"></section><button id="quick" aria-label="Aggiungi movimento">＋</button></main></div><dialog id="editor"><form id="entryForm" method="dialog"><div class="modalhead"><h2 id="editorTitle">Nuovo movimento</h2><button type="button" id="close" class="plain">✕</button></div><div class="seg"><label><input type="radio" name="kind" value="expense" checked> Spesa</label><label><input type="radio" name="kind" value="income"> Entrata</label></div><label>Importo €<input name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required></label><label>Descrizione<input name="description" maxlength="160" autocomplete="off" required></label><div id="suggestions"></div><label>Categoria<select name="category_id" required></select></label><div id="categoryPreview" aria-live="polite"></div><button type="button" id="addCategory" class="category-add">＋ Nuova categoria</button><div id="categoryCreator" hidden><label>Nome nuova categoria<input id="newCategoryName" maxlength="80" autocomplete="off"></label><button type="button" id="saveCategory">Aggiungi e seleziona</button></div><label>Conto<select name="account_id" required></select></label><fieldset class="scope-field"><legend>Ambito</legend><div class="scope-switch"><label class="scope-personal"><input type="radio" name="scope" value="personal" checked><span>● Personale</span></label><label class="scope-household"><input type="radio" name="scope" value="household"><span>⌂ Casa</span></label></div></fieldset><label>Data<input name="date" type="date" required></label><label class="checkbox"><input name="recurring" type="checkbox"> Ripeti ogni mese</label><div id="schedule" hidden><label>Giorno di addebito<input name="day" type="number" min="1" max="31"></label><label>Numero di rate/ricorrenze (vuoto = senza fine)<input name="occurrences" type="number" min="1" max="1200"></label></div><button id="saveEntry">Salva movimento</button></form></dialog><div id="toast" role="status"></div><script src="/static/app.js" defer></script></body></html>
