services:
  app:
    build: .
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    environment:
      DATA_DIR: /data
      BACKUP_DIR: /backups
      TZ: Europe/Rome
      DEPLOY_MODE: ${DEPLOY_MODE:-npm-docker}
    volumes:
      - spese_data:/data
      - ./backups:/backups
    networks:
      - proxy
    # NPM su altro host: setup.sh aggiunge la porta in compose.override.yaml
volumes:
  spese_data:
networks:
  proxy:
    external: true
    name: ${PROXY_NETWORK}
